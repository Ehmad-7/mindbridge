<!DOCTYPE html>

<html>

<head><meta charset="utf-8">

  <title>
    MindBridge
  </title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h1>
      MindBridge
    </h1>

    <p class="subtitle">
      Universal AI Memory Layer
    </p>

    <!-- =====================================
    ACTION BUTTONS
    ====================================== -->

    <button id="showMemory">
      Show Memory
    </button>

    <button id="exportMemory">
      Export Memory
    </button>

    <button id="importMemory">
      Import Memory
    </button>

    <button id="clearMemory">
      Clear Memory
    </button>

    <!-- =====================================
    Hidden file input
    ====================================== -->

    <input
      type="file"
      id="importFile"
      accept=".json"
      hidden
    />

    <!-- =====================================
    STATUS
    ====================================== -->

    <div id="status"></div>

    <!-- =====================================
    OUTPUT
    ====================================== -->

    <pre id="output"></pre>

  </div>

  <script src="popup.js"></script>

</body>

</html>
